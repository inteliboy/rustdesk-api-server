[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rustdesk-api"
version = "0.1.0"
description = "Self-hosted RustDesk API server and management WebUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RustDesk API Server contributors" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "click>=8.1",
    "cryptography>=42",
    "psutil>=5.9",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.scripts]
rustdesk-api = "rustdesk_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rustdesk_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/rustdesk_api/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
