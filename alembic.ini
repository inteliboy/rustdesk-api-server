[alembic]
script_location = src/rustdesk_api/db/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
# Dev-only default so `alembic revision --autogenerate` works directly
# against the local dev database (matches config.py's default). The app
# itself never reads this - see runner.py.
sqlalchemy.url = sqlite:///./data/rustdesk.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
