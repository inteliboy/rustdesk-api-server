name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request supersedes the older run; on main every commit
  # gets its own finished result instead of being cancelled by the next push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # pyproject.toml points pyright at ./.venv, so install into one.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pyright

  webclient:
    name: Web client (type check and build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webclient/package-lock.json
      - run: npm ci
        working-directory: webclient
      - run: npm run typecheck
        working-directory: webclient
      - run: npm run build
        working-directory: webclient
      # The built client is committed (the server never needs Node), so it has to match its source.
      - name: The committed build is up to date
        run: git diff --exit-code -- src/rustdesk_api/web/static/webclient

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # Node is only for the WebUI checks (page scripts against a stub DOM, and "is the committed
      # stylesheet up to date"); the server itself never needs it.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: pip install -e ".[dev]"
      # Every test has its own database file and no fixed port, so they run in parallel.
      # --durations lists the slowest tests, to see where the time goes.
      - run: pytest -q -n auto --durations=30
