<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Web client</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png" />
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
  <script src="/static/js/theme.js"></script>
  <style>
    html[data-i18n-pending] body { visibility: hidden; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--rd-bg, #0b1120); }
    #rd-root { height: 100vh; height: 100dvh; }
    /* Shown until the client takes over, and again if it cannot start. */
    #rd-launch { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; padding: 24px; text-align: center; color: var(--rd-fg, #cbd5e1);
      background: var(--rd-bg, #0b1120); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; z-index: 50; }
    #rd-launch[hidden] { display: none; }
    #rd-launch a { color: var(--rd-accent, #93c5fd); }
    #rd-launch .rd-launch-error { color: var(--rd-danger, #fca5a5); max-width: 34rem; }
    #rd-launch .rd-launch-detail { max-width: 44rem; margin: 0; padding: 10px 14px; text-align: left; white-space: pre-wrap;
      overflow-wrap: anywhere; font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--rd-muted, #94a3b8); background: var(--rd-surface, #111827);
      border: 1px solid var(--rd-border, #334155); border-radius: 8px; }
    #rd-launch .rd-launch-button { margin-right: 14px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--rd-border, #475569);
      background: transparent; color: var(--rd-fg, #e2e8f0); font: inherit; cursor: pointer; }
    #rd-launch .rd-launch-button:hover { background: var(--rd-surface-2, #1e293b); }
  </style>
  {% if lang != "en" %}<script src="/static/i18n/{{ lang }}.js"></script>{% endif %}
  <script src="/static/js/i18n.js"></script>
  <link rel="stylesheet" href="/static/webclient/app.css?v={{ version }}" />
</head>
<body>
  <div id="rd-root">
    <div id="rd-toolbar"></div>
    <div id="rd-viewport">
      <canvas id="rd-canvas"></canvas>
      <div id="rd-stats"></div>
      <div id="rd-overlay"></div>
    </div>
  </div>
  <div id="rd-launch">
    <p id="rd-launch-text">Opening the web client...</p>
    <p id="rd-launch-error" class="rd-launch-error" hidden></p>
    <pre id="rd-launch-detail" class="rd-launch-detail" hidden></pre>
    <p>
      <button id="rd-launch-anyway" type="button" class="rd-launch-button" hidden>Try anyway</button>
      <a id="rd-launch-back" href="/devices" hidden>Back to devices</a>
    </p>
  </div>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/pages/webclient.js" data-version="{{ version }}" data-source="{{ source_url }}"></script>
</body>
</html>
